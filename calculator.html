<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 10px;
      width: 240px;
      border-radius: 12px;
    }
    #screen {
      width: 100%;
      height: 40px;
      background: var(--tg-theme-secondary-bg-color, #0e1621);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      text-align: right;
      padding: 8px 12px;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    button {
      height: 38px;
      border: none;
      border-radius: 6px;
      background: var(--tg-theme-button-color, #2b5278);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { opacity: 0.7; }
    button.op { background: #e5933a; }
    button.clear { background: #d9534f; }
  </style>
</head>
<body>
  <div id="screen">0</div>
  <div class="grid">
    <button class="clear" onclick="clearScreen()">C</button>
    <button onclick="press('(')">(</button>
    <button onclick="press(')')">)</button>
    <button class="op" onclick="press('/')">÷</button>
    
    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button class="op" onclick="press('*')">×</button>
    
    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button class="op" onclick="press('-')">-</button>
    
    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button class="op" onclick="press('+')">+</button>
    
    <button onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button class="op" style="grid-column: span 2" onclick="calculate()">=</button>
  </div>

  <script>
    let screen = document.getElementById('screen');
    let expr = '';

    function press(val) {
      if (screen.innerText === '0' && val !== '.') expr = '';
      expr += val;
      screen.innerText = expr;
    }

    function clearScreen() {
      expr = '';
      screen.innerText = '0';
    }

    function calculate() {
      try {
        let res = Function('"use strict"; return (' + expr + ')')();
        screen.innerText = res;
        expr = String(res);
      } catch (e) {
        screen.innerText = 'Ошибка';
        expr = '';
      }
    }
  </script>
</body>
</html>
