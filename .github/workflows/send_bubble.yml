name: Send HTMLBubble to Telegram

on:
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой на сайте GitHub

jobs:
  send-bubble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Send HTMLBubble via Telegram API
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c '
          import os
          import json
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          # Читаем наш HTML-файл калькулятора
          with open("calculator.html", "r", encoding="utf-8") as f:
              html_content = f.read()

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          # Формируем структуру под HTMLBubbles (версия Telegram 13.2+)
          payload = {
              "chat_id": chat_id,
              "text": "Ваш клиент не поддерживает HTMLBubbles. Обновите Telegram до версии 13.2+",
              "html_bubble": {
                  "content": html_content,
                  "width": 260,
                  "height": 260
              }
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              url, 
              data=data, 
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  print("Успешно отправлено!", response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print("Ошибка отправки:", e.read().decode("utf-8"))
              exit(1)
          '
          
